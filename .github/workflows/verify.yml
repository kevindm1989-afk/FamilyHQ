name: Verify

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

# Cancel in-progress runs on the same PR
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verification gate stack
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for some tools

      # --- Language setup (uncomment what applies) ---

      - name: Setup Node
        if: ${{ hashFiles('package.json') != '' }}
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      # - name: Setup Python
      #   if: ${{ hashFiles('pyproject.toml') != '' || hashFiles('requirements.txt') != '' }}
      #   uses: actions/setup-python@v5
      #   with:
      #     python-version-file: '.python-version'
      #     cache: 'pip'

      # - name: Setup Go
      #   if: ${{ hashFiles('go.mod') != '' }}
      #   uses: actions/setup-go@v5
      #   with:
      #     go-version-file: 'go.mod'

      # - name: Setup Rust
      #   if: ${{ hashFiles('Cargo.toml') != '' }}
      #   uses: dtolnay/rust-toolchain@stable

      # --- Install project dependencies ---

      - name: Install dependencies (Node)
        if: ${{ hashFiles('package-lock.json') != '' }}
        run: npm ci

      # - name: Install dependencies (Python)
      #   if: ${{ hashFiles('requirements.txt') != '' }}
      #   run: pip install -r requirements.txt

      # --- Install verification tools (independent of language) ---

      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.18.0/gitleaks_8.18.0_linux_x64.tar.gz \
            | tar -xz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/

      - name: Install semgrep
        run: pipx install semgrep

      - name: Install Playwright Chromium (for e2e gate)
        # The e2e gate in verify.sh shells out to `playwright test`. Without
        # a browser binary it errors mid-suite ("browserType.launch:
        # Executable doesn't exist"). --with-deps installs the system libs
        # (libnss3, libatk-bridge, libdrm, libxkbcommon, libxcomposite,
        # libxdamage, libxrandr, libgbm, libxss, libasound2) headless
        # Chromium needs on Ubuntu — without it the binary lands but won't
        # launch. Only chromium (not firefox / webkit) per the smoke-tier
        # cross-browser policy in playwright.config.ts.
        if: ${{ hashFiles('playwright.config.ts') != '' }}
        run: npx playwright install --with-deps chromium

      # --- Run the gate stack ---

      - name: Make verify.sh executable
        run: chmod +x scripts/verify.sh

      - name: Run verification
        run: bash scripts/verify.sh

      # --- Report ---

      - name: Verification status
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "::notice::All verification gates passed"
          else
            echo "::error::Verification gates failed"
          fi

  # ---------------------------------------------------------------------------
  # Firestore security-rules isolation tests (USER CONDITION 4).
  #
  # This is a FIRST-CLASS, REQUIRED gate. It runs on EVERY pull_request and push
  # with NO `paths:` filter, so it can never be skipped when firestore.rules
  # changes. The whole point: tenant-isolation tests (the worst failure mode is
  # cross-tenant leakage of children's data — system-design F1) run on every
  # change, not just when someone remembers to.
  #
  # The real rules + test suite are Task 5 (Phase 1). The placeholder spec
  # (test/rules/) keeps this gate green and wired until then.
  # ---------------------------------------------------------------------------
  firestore-rules:
    name: Firestore rules isolation tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      # The Firebase emulator requires a JVM.
      - name: Setup Java (required by the Firestore emulator)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Run rules tests against the Firestore emulator
        run: npx firebase emulators:exec --only firestore "npm run test:rules"
