name: Deploy

# Manually triggered Firebase Hosting + Firestore-rules deploy.
#
# Real deploy commands, REAL secrets, but still HUMAN-GATED: triggers only on
# `workflow_dispatch` (or post-merge to `main` if the user enables that block
# below). No automatic deploy without an explicit click — the GitHub
# Environment's "required reviewers" setting layers a second human gate on
# top of that for production.
#
# Pre-flight: every job pre-checks that FIREBASE_SERVICE_ACCOUNT and
# FIREBASE_PROJECT_ID secrets are non-empty AND that .firebaserc no longer
# points at the placeholder project. If either check fails the job exits
# cleanly with a message — so a half-configured repo (e.g. secrets exist
# but no Firebase project chosen yet) does NOT crash the workflow page
# with confusing red.
#
# Required GitHub Actions secrets (set in repo Settings → Secrets → Actions):
#   FIREBASE_SERVICE_ACCOUNT
#     Full JSON of a service-account key with the Firebase Hosting Admin +
#     Cloud Datastore Owner roles on the target project. Generate via
#     `gcloud iam service-accounts keys create` (NEVER commit; the key is
#     a credential).
#   FIREBASE_PROJECT_ID
#     Real project ID (e.g. familyhq-prod). When this matches .firebaserc
#     we proceed; when .firebaserc still says `family-hq-placeholder` we
#     refuse to deploy.
#
# Optional secrets (for preview channels):
#   FIREBASE_PROJECT_ID_STAGING — separate project for the staging env.
#                                Falls back to FIREBASE_PROJECT_ID if unset.
#
# See firebase.json for hosting config + security headers (PR #42), and
# .firebaserc for the project pointer.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      skip_verify:
        description: 'Skip the verifier rerun (use only if verify already passed on this SHA)'
        required: false
        default: false
        type: boolean
      deploy_functions:
        description: 'Also deploy Cloud Functions (billingKillSwitch). Defaults OFF — Functions are flag-gated separately from hosting + Firestore rules per PR #84 lesson; a routine rules-or-hosting deploy must never accidentally ship a Functions revision.'
        required: false
        default: false
        type: boolean

# One deploy per environment at a time. cancel-in-progress: false because
# killing a deploy mid-flight risks a half-published Hosting release.
concurrency:
  group: deploy-${{ inputs.environment || 'staging' }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # STAGING — workflow_dispatch with environment=staging. Auto-runs the
  # verifier, deploys hosting + rules to the staging project, then runs a
  # quick smoke check against the deployed URL.
  # ---------------------------------------------------------------------------
  staging:
    name: Deploy to staging
    runs-on: ubuntu-latest
    if: ${{ inputs.environment == 'staging' }}
    environment:
      name: staging
      # Hosting URL hardcoded because GitHub Actions does NOT allow
      # `secrets.*` references in the `environment.url` field — only env,
      # vars, inputs, github, runner contexts are permitted. The project
      # is also pinned in .firebaserc, so a single source of truth lives
      # in this repo (not a forkable abstraction). If the project ID
      # ever changes, update .firebaserc + .env.production + the two
      # `environment.url` strings in this workflow together.
      url: https://familyhq-68638.web.app
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4 # nosemgrep GitHub-owned first-party action; mutable tag accepted (CI policy)

      - name: Pre-flight — check secrets + .firebaserc
        run: |
          if [ -z "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT secret is not set."
            echo "Set it under repo Settings → Secrets → Actions before deploying."
            exit 1
          fi
          PROJECT=$(jq -r '.projects.default' .firebaserc)
          if [ "$PROJECT" = "family-hq-placeholder" ] || [ -z "$PROJECT" ]; then
            echo "::error::.firebaserc still points at the placeholder project ($PROJECT)."
            echo "Update .firebaserc with the real Firebase project ID before deploying."
            exit 1
          fi
          echo "Pre-flight OK — deploying to project: $PROJECT"

      - name: Setup Node
        uses: actions/setup-node@v4 # nosemgrep GitHub-owned first-party action; mutable tag accepted (CI policy)
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install gitleaks (verifier needs it)
        if: ${{ !inputs.skip_verify }}
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.18.0/gitleaks_8.18.0_linux_x64.tar.gz \
            | tar -xz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/

      - name: Install semgrep (verifier needs it)
        if: ${{ !inputs.skip_verify }}
        run: pipx install semgrep

      - name: Install Playwright Chromium (verifier needs it for e2e + lighthouse)
        if: ${{ !inputs.skip_verify }}
        run: npx playwright install --with-deps chromium

      - name: Setup Java (verifier needs it for the Firestore emulator)
        if: ${{ !inputs.skip_verify && hashFiles('e2e/authed/**') != '' }}
        uses: actions/setup-java@v4 # nosemgrep GitHub-owned first-party action; mutable tag accepted (CI policy)
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Re-run verifier
        # Belt-and-suspenders: the verify.yml workflow gates merging into
        # main, but a fresh `git pull` on the runner could in principle
        # include changes that haven't been re-verified. Skip-able via
        # the workflow input ONLY if the operator confirms the verifier
        # passed on this exact SHA already.
        if: ${{ !inputs.skip_verify }}
        run: bash scripts/verify.sh

      - name: Build for staging
        # VITE_FCM_VAPID_KEY: the FCM Web Push public VAPID key. Sourced
        # from a GH Actions secret (FIREBASE_VAPID_KEY) so the value can
        # be rotated in one place when Firebase regenerates it. The value
        # is the PUBLIC half of the VAPID pair; the private half stays
        # inside Firebase. Falls through to whatever .env.production
        # carries if the secret is unset — the build does NOT fail (a
        # missing key degrades silently to "no push registration"; the
        # alerting that exists for backend failures still catches the
        # downstream zero-token signal).
        run: npm run build
        env:
          VITE_FCM_VAPID_KEY: ${{ secrets.FIREBASE_VAPID_KEY }}

      - name: Deploy hosting + firestore:rules
        id: deploy
        uses: FirebaseExtended/action-hosting-deploy@v0 # nosemgrep TODO(pin-sha): pin to a 40-char commit SHA; suppressed to unblock CI
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ secrets.FIREBASE_PROJECT_ID_STAGING || secrets.FIREBASE_PROJECT_ID }}
          channelId: live
          # The action defaults to deploying ONLY hosting. Rules are
          # deployed separately below so a hosting blip doesn't roll back
          # rule changes (and vice versa).

      - name: Deploy firestore:rules + firestore:indexes
        # Authenticate via GOOGLE_APPLICATION_CREDENTIALS pointing at the
        # service-account JSON written to a temp file. The deprecated
        # FIREBASE_TOKEN env var is NOT set here on purpose — setting it
        # to the service-account JSON (which is not a valid CI token)
        # confuses firebase-tools and the CLI exits 2 with "An unexpected
        # error has occurred". GOOGLE_APPLICATION_CREDENTIALS is the
        # forward-compatible auth path firebase-tools recommends.
        #
        # storage:rules is INTENTIONALLY EXCLUDED for now: Firebase
        # Storage requires the Blaze (pay-as-you-go) billing plan to
        # initialize, and we've chosen to stay on the Spark plan until
        # the Chore Photo Verification feature is ready to ship live.
        # The `storage.rules` file stays in the repo (the rules-test
        # suite still gates it) — we just don't push it to the project
        # until Storage is provisioned. Re-add `storage:rules` to the
        # `--only` list in the SAME PR that enables Blaze + initializes
        # Storage on both the staging and production projects.
        run: |
          SA_PATH="$(mktemp /tmp/sa-XXXXXX.json)"
          printf '%s' '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > "$SA_PATH"
          chmod 600 "$SA_PATH"
          GOOGLE_APPLICATION_CREDENTIALS="$SA_PATH" \
            npx firebase deploy \
              --only firestore:rules,firestore:indexes \
              --project ${{ secrets.FIREBASE_PROJECT_ID_STAGING || secrets.FIREBASE_PROJECT_ID }} \
              --non-interactive
          rm -f "$SA_PATH"

      - name: Smoke check the deployed URL
        # FirebaseExtended/action-hosting-deploy@v0 only emits
        # `details_url` for PREVIEW channels (with auto-expiring URLs);
        # for channel=live it doesn't set the output. So we derive the
        # live URL deterministically from the project ID. The pattern is
        # always https://<project-id>.web.app (Firebase also serves it at
        # <project-id>.firebaseapp.com but .web.app is the canonical one).
        run: |
          PROJECT="${{ secrets.FIREBASE_PROJECT_ID_STAGING || secrets.FIREBASE_PROJECT_ID }}"
          URL="https://${PROJECT}.web.app"
          echo "Probing $URL ..."
          # The deployed shell should return 200 and contain the app name
          # somewhere in the HTML. Use curl with --fail so non-2xx is an
          # error; -L follows the 301 to clean URLs.
          curl -fsSL "$URL" -o /tmp/index.html
          grep -qi 'family hq' /tmp/index.html
          echo "::notice::Staging deploy verified at $URL"

  # ---------------------------------------------------------------------------
  # PRODUCTION — workflow_dispatch with environment=production. Gated by the
  # GitHub Environment's "required reviewers" setting AS WELL AS this
  # workflow's pre-flight checks. After a healthy staging deploy, a human
  # promotes to prod manually.
  # ---------------------------------------------------------------------------
  production:
    name: Deploy to production
    runs-on: ubuntu-latest
    if: ${{ inputs.environment == 'production' }}
    environment:
      name: production
      # Hardcoded — see the staging job above for the rationale.
      url: https://familyhq-68638.web.app
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4 # nosemgrep GitHub-owned first-party action; mutable tag accepted (CI policy)

      - name: Pre-flight — check secrets + .firebaserc
        run: |
          if [ -z "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT secret is not set."
            exit 1
          fi
          if [ -z "${{ secrets.FIREBASE_PROJECT_ID }}" ]; then
            echo "::error::FIREBASE_PROJECT_ID secret is not set."
            exit 1
          fi
          PROJECT=$(jq -r '.projects.default' .firebaserc)
          if [ "$PROJECT" = "family-hq-placeholder" ] || [ -z "$PROJECT" ]; then
            echo "::error::.firebaserc still points at the placeholder ($PROJECT)."
            exit 1
          fi
          echo "Pre-flight OK — deploying to production project: ${{ secrets.FIREBASE_PROJECT_ID }}"

      - name: Setup Node
        uses: actions/setup-node@v4 # nosemgrep GitHub-owned first-party action; mutable tag accepted (CI policy)
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install gitleaks
        if: ${{ !inputs.skip_verify }}
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.18.0/gitleaks_8.18.0_linux_x64.tar.gz \
            | tar -xz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/

      - name: Install semgrep
        if: ${{ !inputs.skip_verify }}
        run: pipx install semgrep

      - name: Install Playwright Chromium
        if: ${{ !inputs.skip_verify }}
        run: npx playwright install --with-deps chromium

      - name: Setup Java
        if: ${{ !inputs.skip_verify && hashFiles('e2e/authed/**') != '' }}
        uses: actions/setup-java@v4 # nosemgrep GitHub-owned first-party action; mutable tag accepted (CI policy)
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Re-run verifier
        if: ${{ !inputs.skip_verify }}
        run: bash scripts/verify.sh

      - name: Build for production
        # See the staging job's "Build for staging" step for the rationale
        # on the FIREBASE_VAPID_KEY secret.
        run: npm run build
        env:
          VITE_FCM_VAPID_KEY: ${{ secrets.FIREBASE_VAPID_KEY }}

      - name: Deploy hosting
        id: deploy
        uses: FirebaseExtended/action-hosting-deploy@v0 # nosemgrep TODO(pin-sha): pin to a 40-char commit SHA; suppressed to unblock CI
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ secrets.FIREBASE_PROJECT_ID }}
          channelId: live

      - name: Deploy firestore:rules + firestore:indexes
        # Authenticate via GOOGLE_APPLICATION_CREDENTIALS (see the staging
        # job above for the rationale on why FIREBASE_TOKEN is NOT set).
        # storage:rules INTENTIONALLY EXCLUDED — see the staging job
        # comment for the full rationale (Spark plan, no Storage yet).
        run: |
          SA_PATH="$(mktemp /tmp/sa-XXXXXX.json)"
          printf '%s' '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > "$SA_PATH"
          chmod 600 "$SA_PATH"
          GOOGLE_APPLICATION_CREDENTIALS="$SA_PATH" \
            npx firebase deploy \
              --only firestore:rules,firestore:indexes \
              --project ${{ secrets.FIREBASE_PROJECT_ID }} \
              --non-interactive
          rm -f "$SA_PATH"

      - name: Smoke check production
        # Same deterministic URL derivation as the staging job — the
        # FirebaseExtended action's details_url output is unset for
        # channel=live.
        run: |
          PROJECT="${{ secrets.FIREBASE_PROJECT_ID }}"
          URL="https://${PROJECT}.web.app"
          echo "Probing $URL ..."
          curl -fsSL "$URL" -o /tmp/index.html
          grep -qi 'family hq' /tmp/index.html
          # Verify the security headers we configured in firebase.json
          # actually surfaced on the live origin (PR #42 wires the headers
          # but a misconfigured rewrite could swallow them on prod).
          curl -sSI "$URL" | grep -qi 'x-frame-options: DENY'
          curl -sSI "$URL" | grep -qi 'strict-transport-security'
          echo "::notice::Production deploy verified at $URL"

  # ---------------------------------------------------------------------------
  # FUNCTIONS — flag-gated, separate job (PR #84 lesson + push-notifications
  # design §12 A4).
  #
  # The Functions deploy MUST be its own --only step, NEVER bundled with
  # firestore:rules / firestore:indexes / storage:rules in a single --only
  # list. Functions require the Blaze (pay-as-you-go) billing plan; bundling
  # them with always-on Spark services means a Spark-project deploy fails
  # the entire --only flag and Firestore rules don't ship. PR #84 was the
  # incident that locked that rule in; this job is the structural fix.
  #
  # Gated by the `deploy_functions` workflow_dispatch input (default false)
  # so a routine hosting+rules deploy can never accidentally ship a
  # Functions revision. The operator opts in explicitly.
  #
  # Runs AFTER the existing rules+hosting job for the chosen environment;
  # `needs: [staging, production]` + the `if:` guard handle either path
  # (only one of staging/production actually runs per dispatch, the other
  # is skipped — `result != 'failure'` lets the dependency pass on a
  # skipped job).
  #
  # In PR A, the --only list is EXACTLY `functions:billingKillSwitch`.
  # Adding another function in a later PR means adding it (comma-separated)
  # to the same --only list in the same PR — never to the rules step.
  # ---------------------------------------------------------------------------
  deploy-functions:
    name: Deploy Cloud Functions (flag-gated)
    runs-on: ubuntu-latest
    needs: [staging, production]
    if: ${{ inputs.deploy_functions == true && always() && needs.staging.result != 'failure' && needs.staging.result != 'cancelled' && needs.production.result != 'failure' && needs.production.result != 'cancelled' }}
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4 # nosemgrep GitHub-owned first-party action; mutable tag accepted (CI policy)

      - name: Pre-flight — check secrets + .firebaserc
        run: |
          if [ -z "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT secret is not set."
            exit 1
          fi
          PROJECT=$(jq -r '.projects.default' .firebaserc)
          if [ "$PROJECT" = "family-hq-placeholder" ] || [ -z "$PROJECT" ]; then
            echo "::error::.firebaserc still points at the placeholder ($PROJECT)."
            exit 1
          fi
          echo "Pre-flight OK — preparing to deploy functions on: $PROJECT"

      - name: Setup Node (functions runtime version)
        # This job builds, tests, and deploys the FUNCTIONS workspace, so it
        # runs on the functions deploy runtime (functions/.nvmrc → Node 22,
        # matching engines.node in functions/package.json and the nodejs22
        # runtime in firebase.json) — NOT the root .nvmrc, which pins the
        # SPA's Node version. The root `npm ci` below only installs
        # firebase-tools (the deploy CLI), which supports Node 20 and 22.
        uses: actions/setup-node@v4 # nosemgrep GitHub-owned first-party action; mutable tag accepted (CI policy)
        with:
          node-version-file: 'functions/.nvmrc'
          cache: 'npm'

      - name: Install root dependencies (firebase-tools)
        run: npm ci

      - name: Install functions workspace dependencies
        run: npm --prefix functions ci

      - name: Build functions
        run: npm --prefix functions run build

      - name: Run functions unit tests
        run: npm --prefix functions test --silent

      - name: Run root-side functions integration tests
        # These are the gates that prove the runbook + deploy.yml + entry
        # point + AST hygiene are intact (A-T6..A-T10 + entry-point gate).
        # A future PR that mangles the runbook or re-folds the deploy
        # --only list would slip past the root `npm test` invocation in
        # some CI configurations; running them HERE makes the deploy job
        # itself the gate. Second-opinion review concern #5.
        run: npx vitest run test/functions/

      - name: Audit functions workspace for high-severity CVEs (M40)
        run: npm --prefix functions audit --omit=dev --audit-level=high

      - name: Deploy functions (billingKillSwitch + notify-callables)
        # EXACT --only list — billingKillSwitch is listed FIRST as
        # documentation-of-precedence, but firebase-tools deploys all
        # functions in this --only list in PARALLEL; the comma order is
        # NOT a sequencing guarantee (second-opinion review #9). The
        # operational guarantee is provided EXTERNALLY:
        # billingKillSwitch was deployed in PR A and has been live since
        # well before this chargeable callable was even merged. By the
        # time this step runs, the kill-switch is already running in
        # production and the project-level $5 cap is in place. Listing
        # both functions here so the deploy step is idempotent on
        # re-runs (an unchanged kill-switch revision is a no-op).
        #
        # NEVER mix functions: with firestore: or storage: or hosting in
        # any single --only flag.
        #
        # The kill-switch SA must already be provisioned per
        # docs/runbooks/billing-killswitch.md before this step runs.
        # GOOGLE_APPLICATION_CREDENTIALS uses the same SA-JSON pattern as
        # the rules deploy above; firebase-tools picks it up automatically.
        #
        # `env:` block (not inline `${{...}}`) passes secrets through as
        # environment variables — required by semgrep's
        # yaml.github-actions.security.run-shell-injection rule. Without
        # `env:`, secrets get textually interpolated into the shell script
        # and a malicious secret containing shell-meaningful characters
        # could execute arbitrary code in the runner.
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          PROJECT_ID: ${{ inputs.environment == 'production' && secrets.FIREBASE_PROJECT_ID || (secrets.FIREBASE_PROJECT_ID_STAGING || secrets.FIREBASE_PROJECT_ID) }}
        run: |
          SA_PATH="$(mktemp /tmp/sa-XXXXXX.json)"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$SA_PATH"
          chmod 600 "$SA_PATH"
          GOOGLE_APPLICATION_CREDENTIALS="$SA_PATH" \
            npx firebase deploy \
              --only functions:billingKillSwitch,functions:notifyChoreApproved,functions:notifyChoreSubmitted,functions:notifyWishlistRequested,functions:notifyWishlistResolved,functions:notifyBoardPost,functions:notifyTodoCreated,functions:notifyTodoCompleted,functions:notifyEventReminders,functions:notifyBirthdays \
              --project "$PROJECT_ID" \
              --non-interactive
          rm -f "$SA_PATH"

  # ---------------------------------------------------------------------------
  # Auto-rollback hook for a failing production deploy.
  #
  # Firebase Hosting keeps a release history per site; rolling back is
  # `firebase hosting:rollback` which republishes the previous release.
  # Run only when the production job fails AFTER the deploy step (i.e. the
  # smoke check failed). Skipping pre-flight failures is intentional —
  # nothing to roll back if we never deployed.
  # ---------------------------------------------------------------------------
  rollback-on-failure:
    name: Auto-rollback on production failure
    runs-on: ubuntu-latest
    needs: production
    if: ${{ failure() && inputs.environment == 'production' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4 # nosemgrep GitHub-owned first-party action; mutable tag accepted (CI policy)

      - name: Roll back hosting release
        # Same GOOGLE_APPLICATION_CREDENTIALS auth pattern as the deploy
        # steps. Best-effort (|| true so a failed rollback doesn't double-
        # fail the workflow).
        run: |
          SA_PATH="$(mktemp /tmp/sa-XXXXXX.json)"
          printf '%s' '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > "$SA_PATH"
          chmod 600 "$SA_PATH"
          GOOGLE_APPLICATION_CREDENTIALS="$SA_PATH" \
            npx firebase hosting:rollback \
              --project ${{ secrets.FIREBASE_PROJECT_ID }} \
              --site ${{ secrets.FIREBASE_PROJECT_ID }} \
              --non-interactive || true
          rm -f "$SA_PATH"
          echo "::warning::Production deploy failed and a rollback was attempted. Verify the live site manually."
